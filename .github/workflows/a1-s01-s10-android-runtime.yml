name: AutoDrive A1 Android Runtime Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/a1-s01-s10-android-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIP_NAME: AutoDrive-S10-ACCEPTANCE-BLOCKED-WIP_NOT_RELEASE_READY.zip
  PROJECT_DIR: extracted/autodrive-main
  A1_TEST_TARGET_KIND: ISOLATED_NON_PRODUCTION
  AUTODRIVE_SUPABASE_URL: http://10.0.2.2:54321
  AUTODRIVE_SUPABASE_ANON_KEY: synthetic-android-test-key-not-a-secret

jobs:
  android-emulator:
    name: Android emulator / Room / Compose / SMS boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack patched candidate with non-production inert target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_NAME" -d extracted
          cd "$PROJECT_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/ci-patches/s10-acceptance-fixes.patch"
          sed -i '/^AUTODRIVE_SUPABASE_URL=/d;/^AUTODRIVE_SUPABASE_ANON_KEY=/d' gradle.properties
          [[ "$AUTODRIVE_SUPABASE_URL" != *madkfvggyolmdberzmtb* ]]
      - name: Run Android acceptance gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd extracted/autodrive-main && A1_S10_EVIDENCE_DIR="$GITHUB_WORKSPACE/extracted/autodrive-main/s10-evidence" bash tools/a1/s10/run_android_emulator_gate.sh
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-android-runtime-${{ github.sha }}
          path: extracted/autodrive-main/s10-evidence/android/
          if-no-files-found: warn
          retention-days: 30

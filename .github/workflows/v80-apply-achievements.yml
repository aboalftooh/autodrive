name: Apply V80 Achievements Navigation

on:
  push:
    branches: [ fix/achievements-navigation-v80 ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/achievements-navigation-v80
          fetch-depth: 0
      - name: Apply migration
        run: python3 .ci/apply_v80_achievements.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(navigation): restore achievements and remove reports screen'
          git push origin HEAD:fix/achievements-navigation-v80
